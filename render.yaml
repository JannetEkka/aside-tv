# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo. Free plan.
services:
  - type: web
    name: aside-tv
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --app-dir server --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false    # Render asks for these during setup; they never go in the repo
      - key: GROQ_API_KEY
        sync: false
      - key: ASIDE_EVAL
        value: "1"     # lets eval/spoilers.py switch the safeguards off to measure them (public demo films only)
